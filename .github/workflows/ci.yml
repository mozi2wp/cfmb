name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  php:
    name: PHPCS and PHPStan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
      - run: composer install --no-interaction --no-progress
      - run: composer lint
      - run: composer analyse

  php-compat:
    name: PHP ${{ matrix.php }} syntax
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: [ '7.4', '8.0', '8.1', '8.2', '8.3', '8.4' ]
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
      - run: find . -path ./vendor -prune -o -path ./node_modules -prune -o -name '*.php' -print0 | xargs -0 -n1 php -l > /dev/null

  js:
    name: Build, lint and Jest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run lint:js
      - run: npm run test:unit -- --ci
      - name: Built files are committed
        run: git diff --exit-code -- build assets/src/shared/ui-icons.js src/Admin/ui-icons.php

  phpunit-e2e:
    name: PHPUnit and Playwright (wp-env)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: composer install --no-interaction --no-progress
      - run: npm ci
      - run: npm run build
      - run: npm run env start
      - run: npm run test:php
      - run: npx playwright install chromium --with-deps
      - run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: artifacts

  plugin-check:
    name: Plugin Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: composer install --no-dev --optimize-autoloader --no-scripts --no-interaction
      - run: npm ci
      - run: npm run build
      - name: Copy the release files
        run: |
          mkdir -p dist/custom-fields-meta-box
          node -e "for (const f of require('./package.json').files) console.log(f)" | while read -r f; do cp -r --parents "$f" dist/custom-fields-meta-box/; done
      - uses: wordpress/plugin-check-action@v1
        with:
          build-dir: dist/custom-fields-meta-box
